name: Build and Deploy Hugo Site

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

env:
  # hugomods/hugo (the previous image) tops out at 0.154.5, which predates
  # the Hugo template APIs Docsy 0.15.0's llms.txt output depends on. Install
  # Hugo directly instead so we can track a current release.
  HUGO_VERSION: "0.164.0"
  # Docsy's go.mod declares these as Hugo Module (indirect) dependencies, but
  # this site vendors Docsy as a git submodule rather than via Hugo Modules,
  # so they must be fetched explicitly. Keep these in sync with
  # themes/docsy/go.mod whenever the Docsy submodule is bumped.
  FONT_AWESOME_VERSION: "6.7.2"
  BOOTSTRAP_VERSION: "v5.3.8"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Hugo
      run: |
        curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz hugo
        sudo mv hugo /usr/local/bin/hugo
        hugo version

    - name: Vendor Docsy's theme dependencies (Font Awesome, Bootstrap)
      run: |
        git clone --depth 1 --branch "$FONT_AWESOME_VERSION" https://github.com/FortAwesome/Font-Awesome.git themes/github.com/FortAwesome/Font-Awesome
        git clone --depth 1 --branch "$BOOTSTRAP_VERSION" https://github.com/twbs/bootstrap.git themes/github.com/twbs/bootstrap

    - name: Install dependencies
      run: npm install postcss postcss-cli autoprefixer

    - name: Build
      run: hugo --minify --baseURL "https://uwa-channels.github.io"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3.0.1
      with:
        path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

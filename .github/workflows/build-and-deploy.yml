name: Build and Deploy Hugo Site

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

env:
  # hugomods/hugo (the previous image) tops out at 0.154.5, which predates
  # the Hugo template APIs Docsy's llms.txt output depends on. Install Hugo
  # directly instead so we can track a current release.
  HUGO_VERSION: "0.168.0"
  # Docsy compiles its SCSS with Dart Sass, which Hugo looks up as `sass` on
  # PATH. Keep this in sync with sass-embedded in themes/docsy/package.json
  # whenever the Docsy submodule is bumped.
  SASS_EMBEDDED_VERSION: "1.105.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Hugo
      run: |
        curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz hugo
        sudo mv hugo /usr/local/bin/hugo
        hugo version

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # Docsy's theme dependencies (Bootstrap, Font Awesome) come from npm and
    # land in themes/docsy/theme/node_modules, which the theme mounts.
    - name: Install Docsy's theme dependencies
      run: (cd themes/docsy && npm run install:theme-deps)

    - name: Install Dart Sass
      run: |
        npm install --no-save --no-package-lock "sass-embedded@${SASS_EMBEDDED_VERSION}"
        echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Build
      run: hugo --minify --baseURL "https://uwa-channels.github.io"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3.0.1
      with:
        path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

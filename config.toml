baseURL = "https://uwa-channels.github.io"
title = "Underwater Acoustic Channel Library"
theme = ["docsy"]

enableRobotsTXT = false
enableGitInfo = false

contentDir = "content"

pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

[languages]
[languages.en]
title = "Underwater Acoustic Channel Library"
languageName ="English"
weight = 1

[menu]
  [[menu.main]]
  name = "Github"
  weight = 1000
  post = " <i class='fab fa-github pr-2'></i>"
  url = "https://github.com/uwa-channels/"

[security]
  # Hugo's default policy blocks raw HTML content pages (content/_index.html
  # uses one for the homepage). All content here is our own trusted source,
  # so allow any content type.
  allowContent = ['.*']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
      guessSyntax = "true"
      noClasses = "false"


[outputs]
home = ["HTML", "markdown", "LLMS"]
page = ["HTML", "markdown"]
section = ["HTML", "print", "markdown"]

[params]
copyright = "Underwater Acoustic Channels Group"
version_menu = "Releases"
archived_version = false
version = "1.0"
github_repo = "https://github.com/uwa-channels/uwa-channels.github.io"
offlineSearch = true
prism_syntax_highlighting = false
description = "An open-access library of underwater acoustic channel impulse responses and noise models recorded during at-sea experiments, with a replay interface for simulating communication signals."
images = ["featured-background.png"]

[params.ui]
sidebar_menu_compact = false
breadcrumb_disable = false
sidebar_search_disable = false
navbar_logo = true
footer_about_enable = false
showLightDarkModeMenu = true
# Navbar background is always primary blue (see $td-navbar-bg-color in
# assets/scss/_variables_project.scss); use the dark navbar text/link
# palette everywhere so it stays readable against that blue, not just on
# the homepage's cover.
navbar_theme = "dark"


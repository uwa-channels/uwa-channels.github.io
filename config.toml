baseURL = "https://uwa-channels.github.io"
title = "Underwater Acoustic Channel Library"
theme = ["docsy/theme"]

enableRobotsTXT = false
enableGitInfo = false

contentDir = "content"

pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

[imaging]
resampleFilter = "CatmullRom"
anchor = "smart"
[imaging.jpeg]
quality = 75
[imaging.webp]
quality = 75

[languages]
[languages.en]
title = "Underwater Acoustic Channel Library"
label = "English"
weight = 1

[menu]
  [[menu.main]]
  name = "Github"
  weight = 1000
  post = " <i class='fab fa-github pr-2'></i>"
  url = "https://github.com/uwa-channels/"

[security]
  # Hugo's default policy blocks raw HTML content pages (content/_index.html
  # uses one for the homepage). All content here is our own trusted source,
  # so allow any content type.
  allowContent = ['.*']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
      guessSyntax = "true"
      noClasses = "false"


[outputFormats]
  [outputFormats.LLMSFULL]
  baseName = "llms-full"
  isPlainText = true
  mediaType = "text/plain"
  notAlternative = true

[outputs]
home = ["HTML", "markdown", "LLMS", "LLMSFULL"]
page = ["HTML", "markdown"]
section = ["HTML", "print", "markdown"]

[params]
copyright = "Underwater Acoustic Channels Group"
version_menu = "Releases"
archived_version = false
version = "1.0"
github_repo = "https://github.com/uwa-channels/uwa-channels.github.io"
offlineSearch = true
prism_syntax_highlighting = false
description = "An open-access library of underwater acoustic channel impulse responses and noise models recorded during at-sea experiments, with a replay interface for simulating communication signals."
images = ["featured-background.png"]

# The math HTML is generated at build time by Hugo's own bundled KaTeX, and
# the stylesheet Docsy fetches from unpkg must be the same version.  KaTeX
# 0.18.0 renamed the .underline/.overline/.hline/.rule/.accent classes to
# .katex-underline etc., so a stylesheet from one side of that change does
# not style markup from the other, and rules such as the vector underline in
# \hat{\underline{h}} are not drawn at all.  Hugo 0.164.0 bundled KaTeX
# 0.16.22; Hugo 0.168.0, which CI now uses, bundles 0.18.4 (see
# internal/warpc/js/package.json in the Hugo source).  Bump this together
# with HUGO_VERSION in .github/workflows/build-and-deploy.yml;
# tools/check_katex_css.py fails the build if they drift apart.
[params.katex]
version = "0.18.4"

[params.ui]
sidebar_menu_compact = false
breadcrumb_disable = false
sidebar_search_disable = false
navbar_logo = true
footer_about_enable = false
showLightDarkModeMenu = true
# Navbar background is always primary blue (see $td-navbar-bg-color in
# assets/scss/_variables_project.scss); use the dark navbar text/link
# palette everywhere so it stays readable against that blue, not just on
# the homepage's cover.
navbar_theme = "dark"

